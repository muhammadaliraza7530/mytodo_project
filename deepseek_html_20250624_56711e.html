<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        .task-item {
            animation: fadeIn 0.3s ease-out forwards;
        }
        
        .stats-card {
            animation: slideIn 0.4s ease-out forwards;
        }
        
        .stats-card:nth-child(1) { animation-delay: 0.1s; }
        .stats-card:nth-child(2) { animation-delay: 0.2s; }
        .stats-card:nth-child(3) { animation-delay: 0.3s; }
        
        .complete-btn:hover {
            animation: pulse 0.5s ease-in-out;
        }
        
        .theme-toggle:hover {
            animation: float 0.8s ease-in-out infinite;
        }
        
        .glow-text {
            text-shadow: 0 0 8px rgba(110, 231, 183, 0.7);
        }
        
        .glow-border {
            box-shadow: 0 0 15px rgba(110, 231, 183, 0.5);
        }
        
        .transition-all {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            200: '#a7f3d0',
                            300: '#6ee7b7',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        },
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-dark-900 dark:to-dark-800 text-gray-800 dark:text-gray-200 min-h-screen transition-colors duration-300">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <!-- Header with theme toggle -->
        <header class="mb-12 flex justify-between items-center">
            <div>
                <h1 class="text-4xl font-bold text-primary-500 dark:text-primary-400 mb-2 glow-text">TaskFlow</h1>
                <p class="text-gray-500 dark:text-gray-400 font-light">Organize your day with style</p>
            </div>
            <button id="theme-toggle" class="theme-toggle p-3 rounded-full bg-white dark:bg-dark-700 text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-dark-600 transition-all shadow-lg hover:shadow-xl">
                <i class="fas fa-moon dark:hidden text-lg"></i>
                <i class="fas fa-sun hidden dark:block text-lg"></i>
            </button>
        </header>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="stats-card bg-white dark:bg-dark-700 rounded-2xl shadow-lg p-5 border border-gray-100 dark:border-dark-600 transition-all hover:glow-border">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">Total Tasks</p>
                        <h3 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mt-1" id="total-tasks">0</h3>
                    </div>
                    <div class="bg-primary-100 dark:bg-primary-900/20 p-3 rounded-xl">
                        <i class="fas fa-tasks text-primary-500 dark:text-primary-400 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="stats-card bg-white dark:bg-dark-700 rounded-2xl shadow-lg p-5 border border-gray-100 dark:border-dark-600 transition-all hover:glow-border">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">Completed</p>
                        <h3 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mt-1" id="completed-tasks">0</h3>
                    </div>
                    <div class="bg-green-100 dark:bg-green-900/20 p-3 rounded-xl">
                        <i class="fas fa-check-circle text-green-500 dark:text-green-400 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="stats-card bg-white dark:bg-dark-700 rounded-2xl shadow-lg p-5 border border-gray-100 dark:border-dark-600 transition-all hover:glow-border">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">Pending</p>
                        <h3 class="text-3xl font-bold text-gray-800 dark:text-gray-100 mt-1" id="pending-tasks">0</h3>
                    </div>
                    <div class="bg-yellow-100 dark:bg-yellow-900/20 p-3 rounded-xl">
                        <i class="fas fa-clock text-yellow-500 dark:text-yellow-400 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Task Form -->
        <div class="bg-white dark:bg-dark-700 rounded-2xl shadow-lg p-6 mb-8 border border-gray-100 dark:border-dark-600 transition-all transform hover:scale-[1.005]">
            <form id="task-form" class="flex gap-3">
                <div class="flex-grow relative">
                    <input 
                        type="text" 
                        id="task-input" 
                        placeholder="What's on your mind today?" 
                        class="w-full px-5 py-4 border-0 bg-gray-50 dark:bg-dark-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent dark:text-white dark:placeholder-gray-400 text-lg shadow-inner transition-all"
                        autocomplete="off"
                        required
                    >
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                        <i class="fas fa-pen text-gray-400"></i>
                    </div>
                </div>
                <button 
                    type="submit" 
                    class="bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 text-white px-6 py-4 rounded-xl transition-all duration-300 flex items-center gap-2 font-medium text-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5"
                >
                    <i class="fas fa-plus"></i> Add
                </button>
            </form>
        </div>

        <!-- Task Filters -->
        <div class="flex justify-between items-center mb-6">
            <div class="text-gray-500 dark:text-gray-400 font-medium">
                Showing <span id="active-filter" class="text-primary-500 dark:text-primary-400">All</span> tasks
            </div>
            <div class="flex gap-3">
                <button 
                    data-filter="all" 
                    class="filter-btn px-5 py-2.5 rounded-xl bg-primary-500 text-white text-sm font-medium shadow-md hover:shadow-lg transition-all"
                >
                    All
                </button>
                <button 
                    data-filter="pending" 
                    class="filter-btn px-5 py-2.5 rounded-xl bg-white dark:bg-dark-600 text-gray-700 dark:text-gray-200 text-sm font-medium shadow-md hover:shadow-lg transition-all"
                >
                    Pending
                </button>
                <button 
                    data-filter="completed" 
                    class="filter-btn px-5 py-2.5 rounded-xl bg-white dark:bg-dark-600 text-gray-700 dark:text-gray-200 text-sm font-medium shadow-md hover:shadow-lg transition-all"
                >
                    Completed
                </button>
            </div>
        </div>

        <!-- Task List -->
        <div class="bg-white dark:bg-dark-700 rounded-2xl shadow-lg overflow-hidden border border-gray-100 dark:border-dark-600 transition-all">
            <ul id="task-list" class="divide-y divide-gray-200 dark:divide-dark-600">
                <!-- Tasks will be added here dynamically -->
                <li class="p-8 text-center text-gray-500 dark:text-gray-400 text-lg">
                    <i class="fas fa-tasks text-4xl mb-3 opacity-30"></i>
                    <p>Your tasks will appear here</p>
                </li>
            </ul>
        </div>

        <!-- Clear Completed Button -->
        <div class="mt-6 text-center">
            <button 
                id="clear-completed" 
                class="text-sm text-gray-500 dark:text-gray-400 hover:text-primary-500 dark:hover:text-primary-400 transition-all font-medium px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-dark-600"
            >
                <i class="fas fa-broom mr-2"></i> Clear completed tasks
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const taskForm = document.getElementById('task-form');
            const taskInput = document.getElementById('task-input');
            const taskList = document.getElementById('task-list');
            const filterButtons = document.querySelectorAll('.filter-btn');
            const clearCompletedBtn = document.getElementById('clear-completed');
            const activeFilterElement = document.getElementById('active-filter');
            const totalTasksElement = document.getElementById('total-tasks');
            const completedTasksElement = document.getElementById('completed-tasks');
            const pendingTasksElement = document.getElementById('pending-tasks');
            const themeToggle = document.getElementById('theme-toggle');

            // Current filter state
            let currentFilter = 'all';

            // Theme handling
            function setTheme(theme) {
                document.documentElement.classList.toggle('dark', theme === 'dark');
                localStorage.setItem('theme', theme);
            }

            function toggleTheme() {
                const isDark = document.documentElement.classList.contains('dark');
                setTheme(isDark ? 'light' : 'dark');
            }

            // Initialize theme from localStorage or prefer-color-scheme
            const storedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            setTheme(storedTheme || (prefersDark ? 'dark' : 'light'));

            themeToggle.addEventListener('click', toggleTheme);

            // Initialize the app
            function init() {
                loadTasks();
                updateStats();
                setActiveFilter('all');
            }

            // Load tasks from localStorage
            function loadTasks() {
                const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
                renderTasks(tasks);
            }

            // Save tasks to localStorage
            function saveTasks(tasks) {
                localStorage.setItem('tasks', JSON.stringify(tasks));
                updateStats();
            }

            // Add new task
            taskForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const taskText = taskInput.value.trim();
                if (taskText === '') return;

                const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
                const newTask = {
                    id: Date.now(),
                    text: taskText,
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                tasks.unshift(newTask);
                saveTasks(tasks);
                renderTasks(tasks);
                taskInput.value = '';
                taskInput.focus();
            });

            // Render tasks based on current filter
            function renderTasks(tasks) {
                if (tasks.length === 0) {
                    taskList.innerHTML = `
                        <li class="p-8 text-center text-gray-500 dark:text-gray-400 text-lg">
                            <i class="fas fa-tasks text-4xl mb-3 opacity-30"></i>
                            <p>${currentFilter === 'all' ? 'No tasks yet. Add one above!' : 
                              currentFilter === 'completed' ? 'No completed tasks yet' : 
                              'No pending tasks. Great job!'}</p>
                        </li>
                    `;
                    return;
                }

                // Filter tasks based on current filter
                let filteredTasks = tasks;
                if (currentFilter === 'completed') {
                    filteredTasks = tasks.filter(task => task.completed);
                } else if (currentFilter === 'pending') {
                    filteredTasks = tasks.filter(task => !task.completed);
                }

                if (filteredTasks.length === 0) {
                    taskList.innerHTML = `
                        <li class="p-8 text-center text-gray-500 dark:text-gray-400 text-lg">
                            <i class="fas fa-tasks text-4xl mb-3 opacity-30"></i>
                            <p>${currentFilter === 'completed' ? 'No completed tasks yet' : 
                              'No pending tasks. Great job!'}</p>
                        </li>
                    `;
                    return;
                }

                taskList.innerHTML = filteredTasks.map((task, index) => `
                    <li class="task-item p-5 hover:bg-gray-50 dark:hover:bg-dark-600/50 transition-all ${task.completed ? 'opacity-80' : ''}" 
                        data-id="${task.id}" style="animation-delay: ${index * 0.05}s">
                        <div class="flex items-center gap-4">
                            <button class="complete-btn w-8 h-8 rounded-xl border-2 ${task.completed ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300 dark:border-gray-500'} flex items-center justify-center transition-all hover:border-primary-500">
                                ${task.completed ? '<i class="fas fa-check text-sm"></i>' : ''}
                            </button>
                            <div class="flex-grow ${task.completed ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-700 dark:text-gray-200'} text-lg">
                                ${task.text}
                            </div>
                            <div class="flex gap-3">
                                <button class="edit-btn text-gray-400 hover:text-primary-500 dark:hover:text-primary-400 transition-all p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-dark-500" title="Edit">
                                    <i class="fas fa-pencil-alt"></i>
                                </button>
                                <button class="delete-btn text-gray-400 hover:text-red-500 dark:hover:text-red-400 transition-all p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-dark-500" title="Delete">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="text-xs text-gray-400 dark:text-gray-500 mt-2 ml-12">
                            Added: ${new Date(task.createdAt).toLocaleString()}
                            ${task.completed ? '<span class="ml-2 text-green-500"><i class="fas fa-check-circle mr-1"></i>Completed</span>' : ''}
                        </div>
                    </li>
                `).join('');

                // Add event listeners to dynamically created buttons
                document.querySelectorAll('.complete-btn').forEach(btn => {
                    btn.addEventListener('click', toggleTaskComplete);
                });

                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', deleteTask);
                });

                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', editTask);
                });
            }

            // Toggle task completion status
            function toggleTaskComplete(e) {
                const taskId = parseInt(e.target.closest('li').dataset.id);
                const tasks = JSON.parse(localStorage.getItem('tasks'));
                
                const updatedTasks = tasks.map(task => {
                    if (task.id === taskId) {
                        return { ...task, completed: !task.completed };
                    }
                    return task;
                });

                saveTasks(updatedTasks);
                renderTasks(updatedTasks);
            }

            // Delete task
            function deleteTask(e) {
                const taskId = parseInt(e.target.closest('li').dataset.id);
                const tasks = JSON.parse(localStorage.getItem('tasks'));
                
                const updatedTasks = tasks.filter(task => task.id !== taskId);
                saveTasks(updatedTasks);
                renderTasks(updatedTasks);
            }

            // Edit task
            function editTask(e) {
                const listItem = e.target.closest('li');
                const taskId = parseInt(listItem.dataset.id);
                const tasks = JSON.parse(localStorage.getItem('tasks'));
                const task = tasks.find(t => t.id === taskId);
                
                const taskTextElement = listItem.querySelector('div.flex-grow');
                const currentText = task.text;
                
                taskTextElement.innerHTML = `
                    <form class="edit-form flex gap-3 items-center">
                        <input 
                            type="text" 
                            value="${currentText}" 
                            class="flex-grow px-4 py-2 border-0 bg-gray-100 dark:bg-dark-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500 dark:text-white shadow-inner"
                            autocomplete="off"
                            required
                        >
                        <button type="submit" class="bg-primary-500 text-white px-4 py-2 rounded-lg text-sm font-medium shadow hover:shadow-md transition-all">
                            Save
                        </button>
                        <button type="button" class="cancel-edit bg-gray-200 dark:bg-dark-500 text-gray-700 dark:text-gray-200 px-4 py-2 rounded-lg text-sm font-medium shadow hover:shadow-md transition-all">
                            Cancel
                        </button>
                    </form>
                `;
                
                const editForm = listItem.querySelector('.edit-form');
                const cancelBtn = listItem.querySelector('.cancel-edit');
                
                editForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    const newText = editForm.querySelector('input').value.trim();
                    if (newText === '') return;
                    
                    const updatedTasks = tasks.map(t => {
                        if (t.id === taskId) {
                            return { ...t, text: newText };
                        }
                        return t;
                    });
                    
                    saveTasks(updatedTasks);
                    renderTasks(updatedTasks);
                });
                
                cancelBtn.addEventListener('click', function() {
                    renderTasks(tasks);
                });
                
                editForm.querySelector('input').focus();
            }

            // Set active filter
            function setActiveFilter(filter) {
                currentFilter = filter;
                activeFilterElement.textContent = filter.charAt(0).toUpperCase() + filter.slice(1);
                
                filterButtons.forEach(btn => {
                    if (btn.dataset.filter === filter) {
                        btn.classList.remove('bg-white', 'dark:bg-dark-600', 'text-gray-700', 'dark:text-gray-200');
                        btn.classList.add('bg-primary-500', 'text-white');
                    } else {
                        btn.classList.remove('bg-primary-500', 'text-white');
                        btn.classList.add('bg-white', 'dark:bg-dark-600', 'text-gray-700', 'dark:text-gray-200');
                    }
                });
                
                const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
                renderTasks(tasks);
            }

            // Filter button event listeners
            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    setActiveFilter(this.dataset.filter);
                });
            });

            // Clear completed tasks
            clearCompletedBtn.addEventListener('click', function() {
                const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
                const updatedTasks = tasks.filter(task => !task.completed);
                saveTasks(updatedTasks);
                renderTasks(updatedTasks);
            });

            // Update stats
            function updateStats() {
                const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
                const total = tasks.length;
                const completed = tasks.filter(task => task.completed).length;
                const pending = total - completed;
                
                totalTasksElement.textContent = total;
                completedTasksElement.textContent = completed;
                pendingTasksElement.textContent = pending;
            }

            // Initialize the app
            init();
        });
    </script>
</body>
</html>
